<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Posts — Admin</title>
  <link rel="stylesheet" href="/static/css/admin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
<div class="admin-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="ame-label">A.M.E.</div>
      <div class="church-name">ST. Joseph Church</div>
      <div class="admin-badge">Admin Panel</div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Main</div>
      <a href="/admin/dashboard" class="sidebar-link"><span class="icon"><i class="fa fa-gauge"></i></span> Dashboard</a>
      <a href="/admin/posts/new" class="sidebar-link"><span class="icon"><i class="fa fa-plus"></i></span> New Post</a>
      <div class="sidebar-section">Content</div>
      <a href="/admin/posts" class="sidebar-link active"><span class="icon"><i class="fa fa-list"></i></span> All Posts</a>
      <a href="/admin/posts?type=sermon"  class="sidebar-link"><span class="icon"><i class="fa fa-book-bible"></i></span> Sermons</a>
      <a href="/admin/posts?type=event"   class="sidebar-link"><span class="icon"><i class="fa fa-calendar"></i></span> Events</a>
      <a href="/admin/posts?type=program" class="sidebar-link"><span class="icon"><i class="fa fa-star"></i></span> Programs</a>
      <a href="/admin/posts?type=update"  class="sidebar-link"><span class="icon"><i class="fa fa-newspaper"></i></span> Updates</a>
      <a href="/admin/posts?type=gallery" class="sidebar-link"><span class="icon"><i class="fa fa-images"></i></span> Gallery</a>
      <a href="/admin/hymnal" class="sidebar-link"><span class="icon"><i class="fa fa-music"></i></span> Hymnal</a>
      <a href="/admin/program" class="sidebar-link"><span class="icon"><i class="fa fa-file-pdf"></i></span> Sunday Program</a>
      <div class="sidebar-section">Manage</div>
      <a href="/admin/messages" class="sidebar-link"><span class="icon"><i class="fa fa-envelope"></i></span> Messages</a>
      <a href="/admin/users"    class="sidebar-link super-admin-only"><span class="icon"><i class="fa fa-users"></i></span> Users</a>
      <a href="/admin/settings" class="sidebar-link super-admin-only"><span class="icon"><i class="fa fa-gear"></i></span> Settings</a>
      <div class="sidebar-section">Site</div>
      <a href="/" target="_blank" class="sidebar-link"><span class="icon"><i class="fa fa-globe"></i></span> View Website</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="avatar" id="avatar-initial">A</div>
        <div><div class="user-name" id="username-display">Admin</div><div class="user-role" id="user-role-label">Admin</div></div>
      </div>
      <button onclick="logout()" class="sidebar-link" style="width:100%;text-align:left;border:none;background:none;cursor:pointer;color:rgba(255,255,255,0.6);">
        <span class="icon"><i class="fa fa-right-from-bracket"></i></span> Sign Out
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-title" id="page-title">All Posts</div>
      <div class="topbar-actions">
        <a href="/admin/posts/new" class="btn btn-primary btn-sm"><i class="fa fa-plus"></i> New Post</a>
      </div>
    </div>

    <div class="admin-content">
      <!-- Type filter -->
      <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm filter-btn active" data-type="">All</button>
        <button class="btn btn-ghost btn-sm filter-btn" data-type="sermon">Sermons</button>
        <button class="btn btn-ghost btn-sm filter-btn" data-type="event">Events</button>
        <button class="btn btn-ghost btn-sm filter-btn" data-type="program">Programs</button>
        <button class="btn btn-ghost btn-sm filter-btn" data-type="update">Updates</button>
        <button class="btn btn-ghost btn-sm filter-btn" data-type="gallery">Gallery</button>
      </div>

      <div class="admin-table-wrapper">
        <div id="posts-list">
          <div style="text-align:center;padding:60px;"><div class="spinner" style="margin:0 auto;"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/static/js/admin.js"></script>
<script>
let currentType = new URLSearchParams(location.search).get('type') || '';

// Set active filter button based on query param
document.querySelectorAll('.filter-btn').forEach(btn => {
  if (btn.dataset.type === currentType) btn.classList.add('active');
  else btn.classList.remove('active');
  btn.addEventListener('click', () => {
    currentType = btn.dataset.type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadPosts();
  });
});

async function loadPosts() {
  const el = document.getElementById('posts-list');
  el.innerHTML = '<div style="text-align:center;padding:60px;"><div class="spinner" style="margin:0 auto;"></div></div>';
  const url = `/api/admin/posts?limit=100${currentType ? '&type=' + currentType : ''}`;
  const data = await fetch(url).then(r => r.json()).catch(() => ({ posts: [] }));
  const titleMap = { '': 'All Posts', sermon: 'Sermons', event: 'Events', program: 'Programs', update: 'Updates', gallery: 'Gallery' };
  document.getElementById('page-title').textContent = titleMap[currentType] || 'All Posts';

  if (!data.posts.length) {
    el.innerHTML = `<div style="text-align:center;padding:60px;color:var(--text-light);">
      <div style="font-size:2.5rem;margin-bottom:12px;">📝</div>
      <p>No posts found. <a href="/admin/posts/new" style="color:var(--purple-mid);">Create one</a></p>
    </div>`;
    return;
  }

  el.innerHTML = `<table class="admin-table">
    <thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Featured</th><th>Date</th><th>Actions</th></tr></thead>
    <tbody>${data.posts.map(p => `
      <tr>
        <td style="font-weight:600;color:var(--text-dark);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${escHtml(p.title)}">${escHtml(p.title)}</td>
        <td><span class="badge badge-${p.type}">${p.type}</span></td>
        <td>
          <span class="badge ${p.published ? 'badge-published' : 'badge-draft'}" style="cursor:pointer;" onclick="togglePublish(${p.id}, ${p.published}, this)">
            ${p.published ? 'Published' : 'Draft'}
          </span>
        </td>
        <td>${p.featured ? '<i class="fa fa-star" style="color:var(--gold-primary);"></i>' : '<i class="fa fa-star" style="color:var(--border);"></i>'}</td>
        <td style="white-space:nowrap;">${formatDate(p.created_at)}</td>
        <td style="display:flex;gap:6px;">
          <a href="/admin/posts/${p.id}/edit" class="btn btn-ghost btn-sm"><i class="fa fa-pen"></i> Edit</a>
          <button onclick="deletePost(${p.id}, this)" class="btn btn-danger btn-sm"><i class="fa fa-trash"></i></button>
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

async function togglePublish(id, currentlyPublished, el) {
  const newVal = currentlyPublished ? 0 : 1;
  await fetch(`/api/admin/posts/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ published: newVal }) });
  el.textContent = newVal ? 'Published' : 'Draft';
  el.className = `badge ${newVal ? 'badge-published' : 'badge-draft'}`;
  el.onclick = () => togglePublish(id, newVal, el);
}

(async () => {
  const auth = await fetch('/api/auth/status').then(r=>r.json()).catch(()=>({ loggedIn:false }));
  if (!auth.loggedIn) { window.location.href = '/admin/login'; return; }
  document.getElementById('username-display').textContent = auth.username || 'Admin';
  document.getElementById('avatar-initial').textContent = (auth.username || 'A')[0].toUpperCase();
  loadPosts();
})();
</script>
</body>
</html>
